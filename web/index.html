<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUDO 후보 검토 v0</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="pudo_v0_data.js"></script>
<style>
  :root { --ok:#1a9850; --ng:#d73027; --chk:#f39c12; --bg:#fff; --fg:#222; --line:#ddd; --muted:#666; --soft:#f6f6f4; --accent:#1f6feb; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; font:14px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color:var(--fg); background:var(--bg); }
  #app { display:grid; grid-template-columns: 1fr 440px; grid-template-rows:auto 1fr; height:100%; }
  header { grid-column:1 / -1; display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--soft); }
  header strong { font-size:15px; }
  header label { display:flex; gap:4px; align-items:center; font-size:13px; }
  header select, header button { font:inherit; font-size:13px; padding:3px 6px; }
  #map { height:100%; min-height:300px; }
  #side { border-left:1px solid var(--line); overflow:auto; padding:12px 16px 24px; }
  .sum { display:flex; gap:6px; font-size:13px; align-items:center; flex-wrap:wrap; }
  .pill { padding:1px 8px; border-radius:10px; color:#fff; font-size:12.5px; white-space:nowrap; }
  .pill.ok{background:var(--ok)} .pill.ng{background:var(--ng)} .pill.chk{background:var(--chk)}
  h2 { font-size:16px; margin:6px 0 8px; }
  h3 { font-size:14px; margin:14px 0 4px; }
  table.chk { width:100%; border-collapse:collapse; font-size:12.5px; margin:8px 0; }
  table.chk td, table.chk th { border-bottom:1px solid var(--line); padding:4px; text-align:left; vertical-align:top; }
  .p { color:var(--ok); font-weight:bold } .f { color:var(--ng); font-weight:bold } .u { color:var(--chk); font-weight:bold }
  .est { color:var(--muted); font-size:11px; }
  .reason { margin:4px 0; padding-left:18px; font-size:13px; }
  .links a { display:inline-block; margin:4px 8px 4px 0; padding:5px 10px; border:1px solid #888; border-radius:4px; text-decoration:none; color:#174; }
  .btns button { padding:6px 12px; margin-right:6px; cursor:pointer; }
  textarea { width:100%; height:56px; font:inherit; }
  .muted { color:var(--muted); font-size:12px; }
  .back { background:none; border:0; color:var(--accent); cursor:pointer; padding:0; font:inherit; font-size:13px; }
  .bars { width:100%; border-collapse:collapse; font-size:12.5px; }
  .bars td { padding:2px 4px; vertical-align:middle; }
  .bars tr { cursor:pointer; } .bars tr:hover { background:var(--soft); }
  .bars .bar { height:10px; background:var(--ng); border-radius:2px; opacity:.75; }
  .bars .bar.chk { background:var(--chk); }
  .bars td.n { text-align:right; width:44px; font-variant-numeric:tabular-nums; }
  ul.cand { list-style:none; padding:0; margin:4px 0; }
  ul.cand li { padding:4px 6px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px; display:flex; gap:6px; align-items:center; }
  ul.cand li:hover { background:var(--soft); }
  .legend { font-size:12px; line-height:1.9; }
  .sw { display:inline-block; width:14px; height:10px; vertical-align:middle; margin-right:4px; border:1px solid #0003; }
  .note { background:#fff8e6; border:1px solid #f3d48a; padding:6px 8px; border-radius:4px; font-size:12.5px; margin:8px 0; }
  .rv { font-size:11px; padding:0 5px; border-radius:3px; background:#e8eefc; color:#1f4fbf; }
  @media (max-width: 860px) {
    #app { grid-template-columns:1fr; grid-template-rows:auto 55vh auto; }
    #side { border-left:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <strong>PUDO 후보 v0 · 강남역 500m</strong>
    <label>판정 <select id="fVerdict"><option value="">전체</option><option>가능</option><option>확인 필요</option><option>불가</option></select></label>
    <label>도로 <select id="fRoad"><option value="">전체</option><option value="primary">대로</option><option value="tertiary">보조간선</option><option value="residential">이면도로</option><option value="service">골목·단지</option></select></label>
    <label>사유 <select id="fReason"><option value="">전체</option></select></label>
    <label title="어린이보호구역은 표지·노면표시로 추정한 구간이므로, 완화하면 불가 대신 확인 필요로 표시"><input id="fMode" type="checkbox"> 보호구역 완화</label>
    <span class="sum" id="sum"></span>
    <button id="btnExport">GeoJSON 내보내기</button>
  </header>
  <div id="map"></div>
  <div id="side">
    <div id="overview"></div>
    <div id="detail" hidden></div>
  </div>
</div>
<script>
const LAYERS = (typeof PUDO_LAYERS === 'object' && PUDO_LAYERS) || {};
const COLOR = {"가능":"#1a9850","확인 필요":"#f39c12","불가":"#d73027"};
const PILL = {"가능":"ok","확인 필요":"chk","불가":"ng"};
const REASONS = {H1:'H1 교차로', H2:'H2 횡단보도', H3:'H3 정류장', H4:'H4 소화전', H5:'H5 규제선·전용차로', H6:'H6 어린이보호구역', H7:'H7 안전지대', P1:'P1 통과 폭·차로', A1:'A1 보도', A2:'A2 사진 판독'};
const ROAD = {primary:'대로', primary_link:'대로 연결로', tertiary:'보조간선', residential:'이면도로', service:'골목·단지'};
const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lenient = () => $('fMode').checked;
const V = (p) => lenient() ? p.verdict_lenient : p.verdict;
const FR = (p) => lenient() ? p.fail_reasons_lenient : p.fail_reasons;
const CR = (p) => lenient() ? p.check_reasons_lenient : p.check_reasons;
const code = (reason) => String(reason).split(' ')[0];

let reviews = {};
try { reviews = JSON.parse(localStorage.getItem('pudo_reviews') || '{}'); } catch (e) {}
const saveReviews = () => { try { localStorage.setItem('pudo_reviews', JSON.stringify(reviews)); } catch (e) {} };

// 지도: CARTO는 키 없는 요청에 'API KEY REQUIRED' 타일을, OSM은 file://(Referer 없음)에 'Access blocked' 타일을 돌려줍니다.
// 키 없이 열리는 브이월드(국토교통부) 배경지도를 기본으로 씁니다.
const map = L.map('map', {preferCanvas:true}).setView(PUDO_META.center, 16);
const vworld = L.tileLayer('https://xdworld.vworld.kr/2d/Base/service/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© 브이월드(국토교통부)'});
const vworldSat = L.tileLayer('https://xdworld.vworld.kr/2d/Satellite/service/{z}/{x}/{y}.jpeg', {maxZoom:19, attribution:'© 브이월드(국토교통부)'});
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'});
vworld.addTo(map);
L.circle(PUDO_META.center, {radius:PUDO_META.radius_m, color:'#333', weight:1, dashArray:'4 4', fill:false, interactive:false}).addTo(map);

function overlay(name, style) {
  const fc = LAYERS[name];
  if (!fc || !fc.features || !fc.features.length) return null;
  return L.geoJSON(fc, {
    style: () => style,
    pointToLayer: (f, ll) => L.circleMarker(ll, {...style, radius: style.radius || 3}),
    onEachFeature: (f, l) => { if (f.properties && f.properties.label) l.bindTooltip(esc(f.properties.label)); },
    interactive: !!style.interactive,
  });
}
const overlays = {};
const addOverlay = (label, swatch, layer, on) => { if (!layer) return; overlays[`<span class="sw" style="background:${swatch}"></span>${label}`] = layer; if (on) layer.addTo(map); };
addOverlay('교차로 면 (가장자리 5m 금지)', '#f4a259', overlay('intersection', {color:'#d9480f', weight:1, fillColor:'#f4a259', fillOpacity:.35}), true);
addOverlay('어린이보호구역 추정 구간', '#2b8a3e', overlay('child_zone', {color:'#2b8a3e', weight:6, opacity:.55}), true);
addOverlay('보호구역 근거 (표지·노면)', '#69db7c', overlay('child_zone_evidence', {color:'#2b8a3e', fillColor:'#69db7c', fillOpacity:1, weight:1, radius:3, interactive:true}), false);
addOverlay('주정차금지선 (T-GIS 2021)', '#e8b500', overlay('no_stop_line', {color:'#e8b500', weight:3, opacity:.8}), false);
addOverlay('횡단보도', '#4dabf7', overlay('crosswalk', {color:'#1c7ed6', fillColor:'#4dabf7', fillOpacity:1, weight:1, radius:3}), false);
addOverlay('버스정류장', '#9775fa', overlay('bus', {color:'#6741d9', fillColor:'#9775fa', fillOpacity:1, weight:1, radius:4}), false);
addOverlay('소화전', '#ff6b6b', overlay('hydrant', {color:'#c92a2a', fillColor:'#ff6b6b', fillOpacity:1, weight:1, radius:3}), false);
L.control.layers({'브이월드 지도': vworld, '브이월드 위성': vworldSat, 'OSM (서버로 열 때만)': osm}, overlays, {collapsed:false, position:'topright'}).addTo(map);

// 사유 필터 옵션
for (const [k, label] of Object.entries(REASONS)) {
  const o = document.createElement('option'); o.value = k; o.textContent = label; $('fReason').appendChild(o);
}

let layer = null, selected = null, selectedRing = null;
function filtered() {
  const v = $('fVerdict').value, r = $('fRoad').value, why = $('fReason').value;
  return PUDO.features.filter(f => { const p = f.properties;
    if (v && V(p) !== v) return false;
    if (r && !(p.road_type === r || (r === 'primary' && p.road_type === 'primary_link'))) return false;
    if (why && ![...FR(p), ...CR(p)].some(x => code(x) === why)) return false;
    return true; });
}
function draw() {
  if (layer) map.removeLayer(layer);
  const fs = filtered();
  layer = L.geoJSON({type:'FeatureCollection', features:fs}, {
    pointToLayer: (f, ll) => L.circleMarker(ll, {radius:5, color:'#333', weight:0.5, fillColor:COLOR[V(f.properties)], fillOpacity:0.9}),
    onEachFeature: (f, l) => { l.on('click', () => show(f)); l.bindTooltip(`${esc(f.properties.id)} · ${esc(V(f.properties))}`); },
  }).addTo(map);
  const c = {}; fs.forEach(f => c[V(f.properties)] = (c[V(f.properties)] || 0) + 1);
  $('sum').innerHTML = `후보 ${fs.length} <span class="pill ok">가능 ${c['가능']||0}</span> <span class="pill chk">확인 ${c['확인 필요']||0}</span> <span class="pill ng">불가 ${c['불가']||0}</span>`;
  overview(fs);
  if (selected) { if (selectedRing) selectedRing.bringToFront(); }
}

function bars(counts, total, cls) {
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return '<div class="muted">없음</div>';
  const max = rows[0][1];
  return `<table class="bars">${rows.map(([k, n]) => `<tr data-reason="${esc(k)}"><td style="width:150px">${esc(REASONS[k] || k)}</td><td><div class="bar ${cls}" style="width:${(100 * n / max).toFixed(0)}%"></div></td><td class="n">${n}</td></tr>`).join('')}</table>`;
}
function overview(fs) {
  if (!$('detail').hidden) return;
  const fail = {}, need = {};
  fs.forEach(f => { const p = f.properties;
    new Set(FR(p).map(code)).forEach(k => fail[k] = (fail[k] || 0) + 1);
    new Set(CR(p).map(code)).forEach(k => need[k] = (need[k] || 0) + 1); });
  const good = fs.filter(f => V(f.properties) === '가능');
  const near = fs.filter(f => V(f.properties) === '확인 필요').sort((a, b) => CR(a.properties).length - CR(b.properties).length).slice(0, 15);
  const reviewed = Object.keys(reviews).length;
  const item = (f) => { const p = f.properties, rv = reviews[p.id];
    return `<li data-id="${esc(p.id)}"><span class="pill ${PILL[V(p)]}">${esc(V(p))}</span><b>${esc(p.id)}</b> ${esc(p.name || '(이름 없음)')} <span class="muted">${esc(ROAD[p.road_type] || p.road_type)}</span>${rv ? ` <span class="rv">${esc(rv.review || '메모')}</span>` : ''}${V(p) === '확인 필요' ? ` <span class="muted">· 확인 ${CR(p).length}건</span>` : ''}</li>`; };
  $('overview').innerHTML = `
    <h2>판정 개요</h2>
    <div class="muted">지도의 점이나 아래 목록을 누르면 판정 근거가 나옵니다. 사유 막대를 누르면 그 사유로 걸린 후보만 봅니다. 검토 ${reviewed}건 저장됨.</div>
    <div class="note">기본 판정은 지도 데이터만 사용합니다. <b>교차로</b>는 도로교통법 제32조(교차로 안, 가장자리 5m)를 차도 폭으로 추정한 교차로 면에 적용하고, <b>어린이보호구역</b>은 서울시 T-GIS 표지(시작·해제)와 노면 문자표시로 복원한 추정 구간입니다. 오른쪽 위 레이어에서 근거를 켜고 끌 수 있습니다.</div>
    <h3>불가 사유 (후보 수)</h3>${bars(fail, fs.length, '')}
    <h3>확인 필요 사유</h3>${bars(need, fs.length, 'chk')}
    <h3>가능 ${good.length}곳</h3><ul class="cand">${good.map(item).join('') || '<li class="muted">없음</li>'}</ul>
    <h3>확인 필요 중 확인 항목이 적은 곳</h3><ul class="cand">${near.map(item).join('') || '<li class="muted">없음</li>'}</ul>
    <h3>범례</h3>
    <div class="legend"><span class="pill ok">가능</span> 모든 조건 통과 &nbsp; <span class="pill chk">확인 필요</span> 값이 없거나 추정값 &nbsp; <span class="pill ng">불가</span> 법규·물리 조건 위반<br>
    <span class="muted">"(추정)" 표시는 차로 수·폭·보도처럼 지도에서 추정한 값입니다.</span></div>`;
  $('overview').querySelectorAll('tr[data-reason]').forEach(tr => tr.onclick = () => { $('fReason').value = tr.dataset.reason; draw(); });
  $('overview').querySelectorAll('li[data-id]').forEach(li => li.onclick = () => focusId(li.dataset.id));
}

const byId = new Map(PUDO.features.map(f => [f.properties.id, f]));
function focusId(id) {
  const f = byId.get(id); if (!f) return;
  const [lon, lat] = f.geometry.coordinates;
  map.setView([lat, lon], Math.max(map.getZoom(), 18));
  show(f);
}

function photoDetails(report) {
  if (!report) return '';
  const labels = {sidewalk:'보도', curb_blocked:'연석 막힘', curb_line:'규제선', construction:'공사', occupied:'일시적 점유'};
  const states = {applied:'반영됨', review:'확인 필요', rejected:'대응 불일치로 미반영'};
  const rows = Object.entries(report.observations).map(([name, o]) => `<tr><td>${esc(labels[name] || name)}</td><td>${esc(o.value === null ? '모름' : o.value === true ? '있음' : o.value === false ? '없음' : o.value)}</td><td>${o.confidence === null ? '미제공' : esc((o.confidence * 100).toFixed(0) + '%')}</td><td>${esc(o.evidence)}</td></tr>`).join('');
  return `<details><summary>사진 판독 정보 · ${esc(states[report.status] || report.status)}</summary><div class="muted">모델: ${esc(report.model)} · 사진: ${esc(report.image_source)} / ${esc(report.image_id)}</div><div class="muted">반영 항목: ${esc(report.used_fields.map(name => labels[name] || name).join(', ') || '없음')}</div><table class="chk"><tr><th>항목</th><th>관측값</th><th>제공 신뢰도</th><th>근거</th></tr>${rows}</table>${report.review_reasons.map(reason => `<div>${esc(reason)}</div>`).join('')}</details>`;
}

function show(f) {
  selected = f; const p = f.properties, [lon, lat] = f.geometry.coordinates;
  if (selectedRing) map.removeLayer(selectedRing);
  selectedRing = L.circleMarker([lat, lon], {radius:11, color:'#1f6feb', weight:3, fill:false, interactive:false}).addTo(map);
  const rv = reviews[p.id] || {};
  const rows = p.checks.map(c => `<tr><td>${esc(c.item)}</td><td>${c.value === null || c.value === undefined ? '<i>없음</i>' : esc(c.value)}${c.estimated ? ' <span class="est">(추정)</span>' : ''}</td><td class="muted">${esc(c.threshold)}</td><td class="${c.pass === true ? 'p' : c.pass === false ? 'f' : 'u'}">${c.pass === true ? '통과' : c.pass === false ? '탈락' : '모름'}</td></tr>`).join('');
  const kakao = `https://map.kakao.com/link/roadview/${lat},${lon}`;
  const google = p.image_id ? `https://www.google.com/maps/@?api=1&map_action=pano&pano=${encodeURIComponent(p.image_id)}&heading=${p.heading}&fov=90` : null;
  $('overview').hidden = true;
  const d = $('detail'); d.hidden = false;
  d.innerHTML = `
    <button class="back" id="bBack">← 개요로</button>
    <h2>${esc(p.id)} <span class="pill ${PILL[V(p)]}">${esc(V(p))}</span> ${p.score !== null ? `점수 ${esc(p.score)}` : ''}</h2>
    <div class="muted">${esc(p.name || '(이름 없음)')} · ${esc(ROAD[p.road_type] || p.road_type)}${p.oneway ? ' · 일방통행' : ''} · ${lat.toFixed(5)}, ${lon.toFixed(5)} · 바라보는 방향 ${esc(p.heading)}°</div>
    <div class="links"><a href="${kakao}" target="_blank" rel="noopener">카카오 로드뷰 열기</a>${google ? `<a href="${google}" target="_blank" rel="noopener">구글 스트리트뷰 열기</a>` : ''}</div>
    <div class="muted">${p.image_id ? '구글 사진 있음 (사진 ID로 열림)' : '연결된 구글 사진 없음. 카카오 로드뷰로 확인'} · ${p.vision ? '사진 판독 결과 입력됨' : '사진 판독 결과 미입력'}</div>
    ${photoDetails(p.vision)}
    ${FR(p).length ? `<h3>불가 사유</h3><ul class="reason">${FR(p).map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
    ${CR(p).length ? `<h3>확인 필요 사유</h3><ul class="reason">${CR(p).map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
    <table class="chk"><tr><th>항목</th><th>값</th><th>기준</th><th>결과</th></tr>${rows}</table>
    <div class="btns"><button id="bOk">승인</button><button id="bNo">반려</button><button id="bClr">지움</button> <span class="muted" id="rvState"></span></div>
    <textarea id="note" placeholder="메모 (입력하면 자동 저장)">${esc(rv.note || '')}</textarea>
    <div class="muted">승인·반려와 메모는 이 브라우저에만 저장됩니다. "GeoJSON 내보내기"로 파일에 담깁니다.</div>`;
  const state = () => { const r = reviews[p.id]; $('rvState').textContent = r ? `${r.review || '메모만'} (${r.at || ''})` : '검토 전'; };
  const stamp = () => new Date().toISOString().slice(0, 16).replace('T', ' ');
  const save = (review) => {
    const note = $('note').value.trim();
    if (review === null) delete reviews[p.id];
    else reviews[p.id] = {review: review === undefined ? (reviews[p.id] || {}).review || null : review, note, at: stamp()};
    if (reviews[p.id] && !reviews[p.id].review && !reviews[p.id].note) delete reviews[p.id];
    saveReviews(); state();
  };
  state();
  $('bOk').onclick = () => save('승인'); $('bNo').onclick = () => save('반려');
  $('bClr').onclick = () => { $('note').value = ''; save(null); };
  $('note').oninput = () => save(undefined);
  $('bBack').onclick = () => { d.hidden = true; $('overview').hidden = false; if (selectedRing) map.removeLayer(selectedRing); selected = null; draw(); };
}

['fVerdict', 'fRoad', 'fReason', 'fMode'].forEach(id => $(id).addEventListener('input', () => { draw(); if (selected) show(selected); }));
$('btnExport').onclick = () => {
  const fc = {type:'FeatureCollection', features:PUDO.features.map(f => { const r = reviews[f.properties.id] || {}; return {...f, properties:{...f.properties, review:r.review || null, note:r.note || null, reviewed_at:r.at || null}}; })};
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(fc)], {type:'application/geo+json'})); a.download = 'pudo_v0_reviewed.geojson'; a.click();
};
draw();
</script>
</body>
</html>
