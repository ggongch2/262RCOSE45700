<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUDO3 후보 검토 · Qwen3.5</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="pudo_v0_data.js"></script>
<style>
  :root { --ok:#1a9850; --ng:#d73027; --chk:#f39c12; --bg:#fff; --fg:#222; --line:#ddd; --muted:#666; --soft:#f6f6f4; --accent:#1f6feb; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; font:14px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color:var(--fg); background:var(--bg); }
  #app { display:grid; grid-template-columns: 1fr 440px; grid-template-rows:auto 1fr; height:100%; }
  header { grid-column:1 / -1; display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--soft); }
  header strong { font-size:15px; }
  header label { display:flex; gap:4px; align-items:center; font-size:13px; }
  header select, header button { font:inherit; font-size:13px; padding:3px 6px; }
  #map { height:100%; min-height:300px; }
  #side { border-left:1px solid var(--line); overflow:auto; padding:12px 16px 24px; }
  .sum { display:flex; gap:6px; font-size:13px; align-items:center; flex-wrap:wrap; }
  .pill { padding:1px 8px; border-radius:10px; color:#fff; font-size:12.5px; white-space:nowrap; }
  .pill.ok{background:var(--ok)} .pill.ng{background:var(--ng)} .pill.chk{background:var(--chk)}
  h2 { font-size:16px; margin:6px 0 8px; }
  h3 { font-size:14px; margin:14px 0 4px; }
  table.chk { width:100%; border-collapse:collapse; font-size:12.5px; margin:8px 0; }
  table.chk td, table.chk th { border-bottom:1px solid var(--line); padding:4px; text-align:left; vertical-align:top; }
  .p { color:var(--ok); font-weight:bold } .f { color:var(--ng); font-weight:bold } .u { color:var(--chk); font-weight:bold }
  .est { color:var(--muted); font-size:11px; }
  .reason { margin:4px 0; padding-left:18px; font-size:13px; }
  .links a { display:inline-block; margin:4px 8px 4px 0; padding:5px 10px; border:1px solid #888; border-radius:4px; text-decoration:none; color:#174; }
  .btns button { padding:6px 12px; margin-right:6px; cursor:pointer; }
  textarea { width:100%; height:56px; font:inherit; }
  .muted { color:var(--muted); font-size:12px; }
  .back { background:none; border:0; color:var(--accent); cursor:pointer; padding:0; font:inherit; font-size:13px; }
  .bars { width:100%; border-collapse:collapse; font-size:12.5px; }
  .bars td { padding:2px 4px; vertical-align:middle; }
  .bars tr { cursor:pointer; } .bars tr:hover { background:var(--soft); }
  .bars .bar { height:10px; background:var(--ng); border-radius:2px; opacity:.75; }
  .bars .bar.chk { background:var(--chk); }
  .bars td.n { text-align:right; width:44px; font-variant-numeric:tabular-nums; }
  ul.cand { list-style:none; padding:0; margin:4px 0; }
  ul.cand li { padding:4px 6px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px; display:flex; gap:6px; align-items:center; }
  ul.cand li:hover { background:var(--soft); }
  .legend { font-size:12px; line-height:1.9; }
  .sw { display:inline-block; width:14px; height:10px; vertical-align:middle; margin-right:4px; border:1px solid #0003; }
  .note { background:#fff8e6; border:1px solid #f3d48a; padding:6px 8px; border-radius:4px; font-size:12.5px; margin:8px 0; }
  .rv { font-size:11px; padding:0 5px; border-radius:3px; background:#e8eefc; color:#1f4fbf; }
  .rules { flex-basis:100%; display:flex; gap:4px 12px; align-items:center; flex-wrap:wrap; font-size:13px; }
  .rules b { font-size:13px; }
  .rules label.off { color:var(--muted); text-decoration:line-through; }
  .rules button { font-size:12px; padding:1px 6px; }
  tr.off td { color:#aaa; } tr.off td.f, tr.off td.u, tr.off td.p { color:#aaa; font-weight:normal; }
  .pill.new { background:#fff; color:var(--ok); border:1px solid var(--ok); }
  .thbox { flex-basis:100%; font-size:13px; }
  .thbox summary { cursor:pointer; }
  .thgrid { display:flex; flex-wrap:wrap; gap:4px 14px; margin:6px 0 2px; }
  .thgrid label { display:flex; gap:4px; align-items:center; }
  .thgrid input { width:64px; font:inherit; font-size:12.5px; padding:1px 4px; }
  .thgrid input.changed { border:2px solid var(--accent); }
  #busy { font-size:12px; color:var(--accent); }
  @media (max-width: 860px) {
    #app { grid-template-columns:1fr; grid-template-rows:auto 55vh auto; }
    #side { border-left:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <strong>PUDO3 · 강남역 500m · Qwen3.5 4bit 판독</strong>
    <label>판정 <select id="fVerdict"><option value="">전체</option><option>가능</option><option>확인 필요</option><option>불가</option><option value="풀림">규칙 해제로 가능이 된 곳</option></select></label>
    <label>도로 <select id="fRoad"><option value="">전체</option><option value="primary">대로</option><option value="tertiary">보조간선</option><option value="residential">이면도로</option><option value="service">골목·단지</option></select></label>
    <label>사유 <select id="fReason"><option value="">전체</option></select></label>
    <span class="sum" id="sum"></span>
    <button id="btnExport">GeoJSON 내보내기</button>
    <button id="btnHtml" hidden title="지금 조건(기준값·끈 규칙)의 결과를 서버 없이 열리는 HTML 파일로 저장">현재 조건 HTML 저장</button>
    <span id="busy"></span>
    <div class="rules" id="rules" title="체크를 끄면 그 규칙을 빼고 다시 판정합니다. 끈 규칙 때문에 불가·확인 필요였던 곳이 풀립니다."></div>
    <details class="thbox" id="thBox" hidden><summary>기준값 바꾸기 (m) · 바꾸면 서버가 다시 판정</summary><div class="thgrid" id="thInputs"></div></details>
  </header>
  <div id="map"></div>
  <div id="side">
    <div id="overview"></div>
    <div id="detail" hidden></div>
  </div>
</div>
<script>
const LAYERS = (typeof PUDO_LAYERS === 'object' && PUDO_LAYERS) || {};
const COLOR = {"가능":"#1a9850","확인 필요":"#f39c12","불가":"#d73027"};
const PILL = {"가능":"ok","확인 필요":"chk","불가":"ng"};
const REASONS = {H1:'H1 교차로', H2:'H2 횡단보도', H3:'H3 정류장', H4:'H4 소화전', H5:'H5 규제선·전용차로', H6:'H6 어린이보호구역', H7:'H7 안전지대', H8:'H8 택시승강장', P1:'P1 통과 폭·차로', A1:'A1 보도', A2:'A2 사진 판독', A3:'A3 문 개방 공간', A4:'A4 보도 연결', A5:'A5 차량 출입 동선', A6:'A6 고정 시설 차단', H9:'H9 정차 금지 표지', V4:'V4 허용 조건'};
const ROAD = {primary:'대로', primary_link:'대로 연결로', tertiary:'보조간선', residential:'이면도로', service:'골목·단지'};
const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RULES = {H1:'교차로', H2:'횡단보도', H3:'정류장', H4:'소화전', H5:'규제선·전용차로', H6:'어린이보호구역', H7:'안전지대', H8:'택시승강장', P1:'통과 폭·차로', A1:'보도', A2:'차도 끝 접근 막힘(사진)', V0:'사진 대응', H9:'사진 정차 금지 표지', A3:'문 개방 공간', A4:'보도 연결 경로', A5:'차량 출입 동선', A6:'고정 시설 차단', V4:'허용 조건 확인'};
const code = (reason) => String(reason).split(' ')[0];
// 규칙 해제: 끈 규칙의 불가·확인 필요 사유를 빼고 같은 방식(불가 사유 → 불가, 확인 사유 → 확인 필요, 없으면 가능)으로 다시 판정합니다.
let off = new Set();
try { off = new Set(JSON.parse(localStorage.getItem('pudo_rules_off') || '[]')); } catch (e) {}
// 저장된 결과 파일(현재 조건 HTML 저장)은 만든 조건을 그대로 보여 줍니다.
if (PUDO_META.rules_off && PUDO_META.rules_off.length) off = new Set(PUDO_META.rules_off);
// 서버 모드: http로 열고 /api/meta가 응답하면 기준값을 바꿔 서버에서 다시 판정합니다.
let SERVER = false, VLM_ENABLED = false, VLM_INFO = null, DEFAULT_TH = {...(PUDO_META.thresholds || {})}, thresholds = {...DEFAULT_TH};
const photoDrafts = new Map();
const BASE = new Map(PUDO.features.map(f => [f.properties.id, f.properties.verdict]));   // 처음 불러온 판정 (비교 기준)
const saveOff = () => { try { localStorage.setItem('pudo_rules_off', JSON.stringify([...off])); } catch (e) {} };
const active = (reason) => !off.has(code(reason));
const baseV = (p) => BASE.get(p.id) ?? p.verdict;
const FR = (p) => p.fail_reasons.filter(active);
const CR = (p) => p.check_reasons.filter(active);
const V = (p) => FR(p).length ? '불가' : CR(p).length ? '확인 필요' : '가능';
const released = (p) => V(p) === '가능' && baseV(p) !== '가능';

let reviews = {};
try { reviews = JSON.parse(localStorage.getItem('pudo_reviews') || '{}'); } catch (e) {}
const saveReviews = () => { try { localStorage.setItem('pudo_reviews', JSON.stringify(reviews)); } catch (e) {} };

// 지도: CARTO는 키 없는 요청에 'API KEY REQUIRED' 타일을, OSM은 file://(Referer 없음)에 'Access blocked' 타일을 돌려줍니다.
// 키 없이 열리는 브이월드(국토교통부) 배경지도를 기본으로 씁니다.
const map = L.map('map', {preferCanvas:true}).setView(PUDO_META.center, 16);
const vworld = L.tileLayer('https://xdworld.vworld.kr/2d/Base/service/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© 브이월드(국토교통부)'});
const vworldSat = L.tileLayer('https://xdworld.vworld.kr/2d/Satellite/service/{z}/{x}/{y}.jpeg', {maxZoom:19, attribution:'© 브이월드(국토교통부)'});
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'});
vworld.addTo(map);
L.circle(PUDO_META.center, {radius:PUDO_META.radius_m, color:'#333', weight:1, dashArray:'4 4', fill:false, interactive:false}).addTo(map);

function overlay(name, style) {
  const fc = LAYERS[name];
  if (!fc || !fc.features || !fc.features.length) return null;
  return L.geoJSON(fc, {
    style: () => style,
    pointToLayer: (f, ll) => L.circleMarker(ll, {...style, radius: style.radius || 3}),
    onEachFeature: (f, l) => { if (f.properties && f.properties.label) l.bindTooltip(esc(f.properties.label)); },
    interactive: !!style.interactive,
  });
}
const overlays = {};
const addOverlay = (label, swatch, layer, on) => { if (!layer) return; overlays[`<span class="sw" style="background:${swatch}"></span>${label}`] = layer; if (on) layer.addTo(map); };
addOverlay('교차로 면 (가장자리 5m 금지)', '#f4a259', overlay('intersection', {color:'#d9480f', weight:1, fillColor:'#f4a259', fillOpacity:.35}), true);
addOverlay('어린이보호구역 (경찰청 경계, 없으면 추정 구간)', '#2b8a3e', overlay('child_zone', {color:'#2b8a3e', weight:3, opacity:.7, fillOpacity:.25}), true);
addOverlay('보도 (1:1000 수치지형도)', '#748ffc', overlay('sidewalk', {color:'#4263eb', weight:1, fillColor:'#748ffc', fillOpacity:.4}), false);
addOverlay('보호구역 근거 (표지·노면)', '#69db7c', overlay('child_zone_evidence', {color:'#2b8a3e', fillColor:'#69db7c', fillOpacity:1, weight:1, radius:3, interactive:true}), false);
addOverlay('주정차금지선 (T-GIS 2021)', '#e8b500', overlay('no_stop_line', {color:'#e8b500', weight:3, opacity:.8}), false);
addOverlay('횡단보도', '#4dabf7', overlay('crosswalk', {color:'#1c7ed6', fillColor:'#4dabf7', fillOpacity:1, weight:1, radius:3}), false);
addOverlay('버스정류장', '#9775fa', overlay('bus', {color:'#6741d9', fillColor:'#9775fa', fillOpacity:1, weight:1, radius:4}), false);
addOverlay('소화전', '#ff6b6b', overlay('hydrant', {color:'#c92a2a', fillColor:'#ff6b6b', fillOpacity:1, weight:1, radius:3}), false);
addOverlay('택시승차대', '#fcc419', overlay('taxi_stand', {color:'#e67700', fillColor:'#fcc419', fillOpacity:1, weight:1, radius:5, interactive:true}), true);
L.control.layers({'브이월드 지도': vworld, '브이월드 위성': vworldSat, 'OSM (서버로 열 때만)': osm}, overlays, {collapsed:false, position:'topright'}).addTo(map);

// 규칙 목록은 처음 불러온 판정(기본 조건)에 나온 규칙 코드로 한 번만 만듭니다.
// 끈 규칙은 서버 판정 결과에서 사유가 빠지므로, 매번 결과에서 다시 만들면 목록에서 사라집니다.
const PRESENT = new Set(off);
PUDO.features.forEach(f => [...f.properties.fail_reasons, ...f.properties.check_reasons].forEach(r => PRESENT.add(code(r))));
function drawRules() {
  const keys = Object.keys(RULES).filter(k => PRESENT.has(k));
  $('rules').innerHTML = `<b>적용 규칙</b>` + keys.map(k => `<label class="${off.has(k) ? 'off' : ''}"><input type="checkbox" data-rule="${k}" ${off.has(k) ? '' : 'checked'}> ${k} ${esc(RULES[k])}</label>`).join('')
    + ` <button id="rulesAll">모두 적용</button>`;
  $('rules').querySelectorAll('input[data-rule]').forEach(box => box.onchange = () => {
    box.checked ? off.delete(box.dataset.rule) : off.add(box.dataset.rule);
    saveOff(); drawRules(); refresh();
  });
  $('rulesAll').onclick = () => { off.clear(); saveOff(); drawRules(); refresh(); };
}

// 조건이 바뀌면: 서버 모드는 서버에서 다시 판정, 파일로 열면 사유만 빼서 다시 표시합니다.
async function refresh() {
  if (SERVER) {
    $('busy').textContent = '판정 중…';
    try {
      const res = await fetch('/api/evaluate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({thresholds, rules_off:[...off]})});
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || res.status);
      PUDO.features = body.features; byId = new Map(PUDO.features.map(f => [f.properties.id, f]));
      if (selected) selected = byId.get(selected.properties.id) || null;
      $('busy').textContent = '';
    } catch (e) { $('busy').textContent = `판정 실패: ${e.message}`; return; }
  }
  draw(); if (selected) show(selected);
}

function drawThresholds() {
  $('thInputs').innerHTML = Object.entries(DEFAULT_TH).map(([k, v]) =>
    `<label>${esc(k)} <input type="number" min="0" step="0.5" data-th="${esc(k)}" value="${esc(thresholds[k])}" class="${thresholds[k] !== v ? 'changed' : ''}"></label>`).join('')
    + ` <button id="thReset">기본값으로</button>`;
  $('thInputs').querySelectorAll('input[data-th]').forEach(input => input.onchange = () => {
    const value = Number(input.value);
    if (!Number.isFinite(value) || value < 0) { input.value = thresholds[input.dataset.th]; return; }
    thresholds[input.dataset.th] = value; drawThresholds(); refresh();
  });
  $('thReset').onclick = () => { thresholds = {...DEFAULT_TH}; drawThresholds(); refresh(); };
}

async function connectServer() {
  if (!location.protocol.startsWith('http')) return;
  try {
    const res = await fetch('/api/meta');
    if (!res.ok) return;
    const meta = await res.json();
    SERVER = true; DEFAULT_TH = meta.thresholds; thresholds = {...DEFAULT_TH};
    VLM_ENABLED = !!meta.vlm; VLM_INFO = meta.vlm_info;
    $('thBox').hidden = false; $('btnHtml').hidden = false;
    drawThresholds();
    if (off.size) refresh();
    else if (selected) show(selected);
  } catch (e) { /* 서버 없이 연 경우 */ }
}
drawRules();

// 사유 필터 옵션
for (const [k, label] of Object.entries(REASONS)) {
  const o = document.createElement('option'); o.value = k; o.textContent = label; $('fReason').appendChild(o);
}

let layer = null, selected = null, selectedRing = null;
function filtered() {
  const v = $('fVerdict').value, r = $('fRoad').value, why = $('fReason').value;
  return PUDO.features.filter(f => { const p = f.properties;
    if (v === '풀림' ? !released(p) : (v && V(p) !== v)) return false;
    if (r && !(p.road_type === r || (r === 'primary' && p.road_type === 'primary_link'))) return false;
    if (why && ![...FR(p), ...CR(p)].some(x => code(x) === why)) return false;
    return true; });
}
function draw() {
  if (layer) map.removeLayer(layer);
  const fs = filtered();
  layer = L.geoJSON({type:'FeatureCollection', features:fs}, {
    pointToLayer: (f, ll) => released(f.properties)
      ? L.circleMarker(ll, {radius:6, color:'#0b3d1f', weight:2, fillColor:COLOR['가능'], fillOpacity:1})
      : L.circleMarker(ll, {radius:5, color:'#333', weight:0.5, fillColor:COLOR[V(f.properties)], fillOpacity:0.9}),
    onEachFeature: (f, l) => { l.on('click', () => show(f)); l.bindTooltip(`${esc(f.properties.id)} · ${esc(V(f.properties))}`); },
  }).addTo(map);
  const c = {}; fs.forEach(f => c[V(f.properties)] = (c[V(f.properties)] || 0) + 1);
  const freed = fs.filter(f => released(f.properties)).length;
  $('sum').innerHTML = `후보 ${fs.length} <span class="pill ok">가능 ${c['가능']||0}</span> <span class="pill chk">확인 ${c['확인 필요']||0}</span> <span class="pill ng">불가 ${c['불가']||0}</span>`
    + (off.size ? ` <span class="pill new">해제로 가능 +${freed}</span>` : '');
  overview(fs);
  if (selected) { if (selectedRing) selectedRing.bringToFront(); }
}

function bars(counts, total, cls) {
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return '<div class="muted">없음</div>';
  const max = rows[0][1];
  return `<table class="bars">${rows.map(([k, n]) => `<tr data-reason="${esc(k)}"><td style="width:150px">${esc(REASONS[k] || k)}</td><td><div class="bar ${cls}" style="width:${(100 * n / max).toFixed(0)}%"></div></td><td class="n">${n}</td></tr>`).join('')}</table>`;
}
function overview(fs) {
  if (!$('detail').hidden) return;
  const fail = {}, need = {};
  fs.forEach(f => { const p = f.properties;
    new Set(FR(p).map(code)).forEach(k => fail[k] = (fail[k] || 0) + 1);
    new Set(CR(p).map(code)).forEach(k => need[k] = (need[k] || 0) + 1); });
  const good = fs.filter(f => V(f.properties) === '가능');
  const freed = good.filter(f => released(f.properties));
  const near = fs.filter(f => V(f.properties) === '확인 필요').sort((a, b) => CR(a.properties).length - CR(b.properties).length).slice(0, 15);
  const reviewed = Object.keys(reviews).length;
  const item = (f) => { const p = f.properties, rv = reviews[p.id];
    return `<li data-id="${esc(p.id)}"><span class="pill ${PILL[V(p)]}">${esc(V(p))}</span><b>${esc(p.id)}</b> ${esc(p.name || '(이름 없음)')} <span class="muted">${esc(ROAD[p.road_type] || p.road_type)}</span>${rv ? ` <span class="rv">${esc(rv.review || '메모')}</span>` : ''}${V(p) === '확인 필요' ? ` <span class="muted">· 확인 ${CR(p).length}건</span>` : ''}</li>`; };
  $('overview').innerHTML = `
    <h2>판정 개요</h2>
    <div class="muted">지도의 점이나 아래 목록을 누르면 판정 근거가 나옵니다. 사유 막대를 누르면 그 사유로 걸린 후보만 봅니다. 검토 ${reviewed}건 저장됨.</div>
    <div class="note">기본 판정은 지도 데이터만 사용합니다. <b>교차로</b>는 도로교통법 제32조(교차로 안, 가장자리 5m)를 차도 폭으로 추정한 교차로 면에 적용하고, <b>어린이보호구역</b>은 서울시 T-GIS 표지(시작·해제)와 노면 문자표시로 복원한 추정 구간입니다. 오른쪽 위 레이어에서 근거를 켜고 끌 수 있습니다.</div>
    <h3>불가 사유 (후보 수)</h3>${bars(fail, fs.length, '')}
    <h3>확인 필요 사유</h3>${bars(need, fs.length, 'chk')}
    ${off.size ? `<div class="note">해제한 규칙: <b>${[...off].map(k => esc(`${k} ${RULES[k] || ''}`)).join(', ')}</b>. 이 규칙의 사유를 빼고 다시 판정한 결과입니다. 굵은 테두리 초록 점이 해제로 새로 가능해진 곳입니다.</div>
    <h3>규칙 해제로 새로 가능해진 곳 ${freed.length}곳</h3><ul class="cand">${freed.map(item).join('') || '<li class="muted">없음</li>'}</ul>` : ''}
    <h3>가능 ${good.length}곳</h3><ul class="cand">${good.map(item).join('') || '<li class="muted">없음</li>'}</ul>
    <h3>확인 필요 중 확인 항목이 적은 곳</h3><ul class="cand">${near.map(item).join('') || '<li class="muted">없음</li>'}</ul>
    <h3>범례</h3>
    <div class="legend"><span class="pill ok">가능</span> 모든 조건 통과 &nbsp; <span class="pill chk">확인 필요</span> 값이 없거나 추정값 &nbsp; <span class="pill ng">불가</span> 법규·물리 조건 위반<br>
    <span class="muted">"(추정)" 표시는 차로 수·폭·보도처럼 지도에서 추정한 값입니다.</span></div>`;
  $('overview').querySelectorAll('tr[data-reason]').forEach(tr => tr.onclick = () => { $('fReason').value = tr.dataset.reason; draw(); });
  $('overview').querySelectorAll('li[data-id]').forEach(li => li.onclick = () => focusId(li.dataset.id));
}

let byId = new Map(PUDO.features.map(f => [f.properties.id, f]));
function focusId(id) {
  const f = byId.get(id); if (!f) return;
  const [lon, lat] = f.geometry.coordinates;
  map.setView([lat, lon], Math.max(map.getZoom(), 18));
  show(f);
}

// ---- Qwen3.5 2단계 판독 (pudo3: 1차 생각 끔 · 2차 생각 켬) ---------------------------------------------
const VERDICT_PILL = {'가능':'ok','불가':'ng','판단 불가':'chk'};
const STATUS_TEXT = {pass:'통과', fail:'불가', unknown:'미확인', note:'참고'};
const STATUS_CLS = {pass:'p', fail:'f', unknown:'u', note:'muted'};
const OBS_TYPE = {metal_railing:'금속 난간', permanent_fence:'고정 펜스', wall:'벽', planter:'화단', bollard:'볼라드', other_fixed:'기타 고정 구조물', temporary_facility:'임시 시설', none:'없음', unknown:'알 수 없음'};
const OBS_REL = {curb_edge:'차도–보도 사이(연석 위)', inside_sidewalk:'보도 내부', property_boundary:'보도 뒤 건물·대지 경계', background:'무관한 배경', none:'없음', unknown:'불명'};
const tri = v => v === null || v === undefined ? '확인 못함(null)' : v === true ? '예' : v === false ? '아니오' : String(v);

function qwenDecisionHtml(d) {
  if (!d) return '';
  const fails = d.fail_reasons || [], unv = d.unverified || [], notes = d.notes || [], scene = d.scene_conditions || [];
  return `<section class="note"><h3>최종 Python 판정: <span class="pill ${VERDICT_PILL[d.verdict] || 'chk'}">${esc(d.verdict)}</span></h3>
    <p><b>${esc(d.reason)}</b></p>
    ${fails.length ? `<div><b>확정된 불가 사유</b><ul class="reason">${fails.map(r => `<li><b>${esc(r.reason)}</b>${r.evidence ? `<br><span class="muted">사진 근거: ${esc(r.evidence)}</span>` : ''}</li>`).join('')}</ul></div>` : ''}
    ${unv.length ? `<details open><summary>확인하지 못한 조건 ${unv.length}개</summary><ul class="reason">${unv.map(r => `<li><b>${esc(r.label)}</b>: ${esc(r.reason)}${r.evidence ? `<br><span class="muted">사진 근거: ${esc(r.evidence)}</span>` : ''}</li>`).join('')}</ul></details>` : ''}
    ${notes.length ? `<details><summary>판정 참고 ${notes.length}개 (불가 사유 아님)</summary><ul class="reason">${notes.map(n => `<li>${esc(n.note)}</li>`).join('')}</ul></details>` : ''}
    ${scene.length ? `<div class="muted"><b>촬영 당시 일시 상태 — 상시 판정과 분리</b>${scene.map(c => `<div>${esc(c.label)}: ${esc(c.note)}${c.evidence ? ` · ${esc(c.evidence)}` : ''}</div>`).join('')}</div>` : ''}
    <div class="muted">${esc(d.scope || '')}</div></section>`;
}

function qwenOverlay(rec, imageB64, manual, interactive = true) {
  const [W, H] = rec.image_size || [1280, 720];
  const sb = rec.search && rec.search.valid && rec.search.box ? rec.search.box.map((v, i) => v / 1000 * (i % 2 ? H : W)) : null;
  const sp = rec.search && rec.search.valid && rec.search.predicted_point ? [rec.search.predicted_point[0] / 1000 * W, rec.search.predicted_point[1] / 1000 * H] : null;
  const mp = manual ? [manual[0] / 1000 * W, manual[1] / 1000 * H] : null;
  const t = rec.target_pixel || null;
  const kx = t ? t.x / t.width * W : null, ky = t ? t.y / t.height * H : null;
  const s = rec.reading_pixel || rec.snapped_curb_pixel, r = rec.curb_region_pixel, sr = rec.sidewalk_region_pixel;
  const svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
    ${sb ? `<rect x="${sb[0]}" y="${sb[1]}" width="${sb[2]-sb[0]}" height="${sb[3]-sb[1]}" fill="none" stroke="#000" stroke-width="5" stroke-dasharray="14 9"/>
      <rect x="${sb[0]}" y="${sb[1]}" width="${sb[2]-sb[0]}" height="${sb[3]-sb[1]}" fill="none" stroke="#ffdc00" stroke-width="3" stroke-dasharray="14 9"/>` : ''}
    ${rec.localization && rec.localization.lifted ? `<circle cx="${rec.localization.model_point[0] / 1000 * W}" cy="${rec.localization.model_point[1] / 1000 * H}" r="7" fill="none" stroke="#000" stroke-width="5"/><circle cx="${rec.localization.model_point[0] / 1000 * W}" cy="${rec.localization.model_point[1] / 1000 * H}" r="7" fill="none" stroke="#bbb" stroke-width="3"/>` : ''}
    ${mp ? `<circle cx="${mp[0]}" cy="${mp[1]}" r="15" fill="none" stroke="#000" stroke-width="7"/><circle cx="${mp[0]}" cy="${mp[1]}" r="15" fill="none" stroke="#ff2bd6" stroke-width="4"/><circle cx="${mp[0]}" cy="${mp[1]}" r="3" fill="#ff2bd6"/>` : ''}
    ${t ? `<line x1="${kx}" y1="0" x2="${kx}" y2="${H}" stroke="#e11" stroke-width="2" stroke-dasharray="10 8" opacity=".7"/>
      <circle cx="${kx}" cy="${ky}" r="14" fill="none" stroke="#e11" stroke-width="4"/>` : ''}
    ${sr ? `<rect x="${sr[0]}" y="${sr[1]}" width="${sr[2]-sr[0]}" height="${sr[3]-sr[1]}" fill="none" stroke="#00c8ff" stroke-width="2" stroke-dasharray="6 4"/>` : ''}
    ${r ? `<rect x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" fill="none" stroke="#000" stroke-width="6"/>
      <rect x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" fill="none" stroke="#ff8c00" stroke-width="3"/>` : ''}
    ${s ? `<rect x="${s[0]-13}" y="${s[1]-13}" width="26" height="26" fill="none" stroke="#000" stroke-width="7"/>
      <rect x="${s[0]-13}" y="${s[1]-13}" width="26" height="26" fill="none" stroke="#00c8ff" stroke-width="4"/>
      <line x1="${s[0]-34}" y1="${s[1]}" x2="${s[0]+34}" y2="${s[1]}" stroke="#00c8ff" stroke-width="3"/>
      <line x1="${s[0]}" y1="${s[1]-34}" x2="${s[0]}" y2="${s[1]+34}" stroke="#00c8ff" stroke-width="3"/>` : ''}
  </svg>`;
  const legend = `<div class="muted"><span style="color:#e11">● 빨간 원·점선</span> 카카오 후보 지리 좌표 마커 (참고 표시만${t ? '' : ' — 이 화면에서는 화면 밖이라 없음'}) ·
    <span style="color:#b39500">▭ 노란 점선</span> 후보 보도 탐색 범위 (위쪽 끝 = 지평선 바로 아래)${sb ? '' : (rec.search ? ' (계산 불가: ' + esc(rec.search.reason || '') + ')' : ' (이전 기록: 없음)')} ·
    <span style="color:#0098c2">■ 하늘색 사각형+십자선</span> 판독 지점 (${rec.reading_source === 'manual' ? '직접 지정' : 'Qwen이 찾은 보도'})${s ? '' : ' (찾지 못함 — 표시 없음)'} ·
    <span style="color:#d97400">▭ 주황색 사각형</span> 바로 앞 연석${imageB64 && interactive ? ' · <span style="color:#d01aa8">◎ 분홍 원</span> 사진을 클릭해 직접 지정한 위치' : ''}</div>`;
  if (!imageB64) return `<div class="muted">원본 로드뷰 이미지는 저장하지 않습니다(진단 저장 옵션 미사용). 다시 판독하면 표시됩니다.</div>${legend}`;
  if (!interactive) return `<div style="position:relative;width:100%;aspect-ratio:${W}/${H}"><img alt="원본 로드뷰" src="data:image/png;base64,${imageB64}" style="position:absolute;inset:0;width:100%;height:100%">${svg}</div>${legend}`;
  return `<div id="qwenPhoto" title="클릭해서 판독 위치(보도 바닥)를 직접 지정" style="position:relative;width:100%;aspect-ratio:${W}/${H};cursor:crosshair"><img alt="원본 로드뷰" src="data:image/png;base64,${imageB64}" style="position:absolute;inset:0;width:100%;height:100%">${svg}</div>${legend}
    <div class="muted">판독 위치가 틀렸으면 사진에서 승객이 설 보도 바닥을 클릭한 뒤 아래 버튼을 누르세요. 2차 판독만 다시 합니다.</div>
    <p><button id="photoManual" ${manual ? '' : 'disabled'}>${manual ? `클릭한 위치 [${manual.map(v => v.toFixed(0)).join(', ')}]로 2차 다시 판독` : '사진을 클릭해 위치를 지정하세요'}</button></p>`;
}

const LINE_MEASURE_KO = {yellow_dashed: '황색 점선', yellow_solid: '황색 실선', yellow_double: '황색 복선', white: '흰색 선', none: '선 없음', null: '확인 못함'};
function stopCheckHtml(rec, images, manual) {
  const v = rec.viewpoint || {}, m = rec.model || {}, a = rec.assessment, d = rec.decision;
  const condRows = (d.conditions || []).map(c => `<tr><td>${esc(c.label)}</td><td>${esc(c.value)}</td><td class="${STATUS_CLS[c.status] || ''}">${esc(STATUS_TEXT[c.status] || c.status)}</td><td>${esc(c.evidence)}</td></tr>`).join('');

    ${rec.assessment_error ? `<div class="f">검증 실패: ${esc(rec.assessment_error)}</div>` : ''}

    ${a && a.barrier && a.barrier.excluded ? `<div class="muted">'${esc(a.barrier.excluded)}'는 사이로 지나갈 수 있거나 일시적인 것이라 고정 장애물로 보지 않음</div>` : ''}
    ${rec.curb_line_measure ? `<div class="muted">차선 색 측정: <b>${esc(LINE_MEASURE_KO[rec.curb_line_measure.value] || '판단 보류')}</b> · ${esc(rec.curb_line_measure.evidence)}${a && a.curb_line && a.curb_line.source === 'color_measure' ? ` · 모델 답 ${esc(LINE_MEASURE_KO[a.curb_line.model_value] || a.curb_line.model_value)} 대신 측정값 사용` : (a && a.curb_line && a.curb_line.measure_agrees ? ' · 모델 답과 같음' : '')}</div>` : ''}
    <h3>원본 로드뷰 (모델에 그대로 넣은 사진)</h3>${qwenOverlay({...rec, search: null}, images && images.original, manual)}
    <div class="muted">파노라마 ${esc(rec.pano_id)} · 촬영 위치↔후보 거리 <b>${esc(rec.distance_m)}m</b> · 화면 방향 pan ${esc(Number(v.pan).toFixed(1))}° / tilt ${esc(Number(v.tilt).toFixed(1))}° / zoom ${esc(v.zoom)}<br>
      ${rec.camera_offset ? `촬영 위치는 후보에서 도로를 따라 <b>${esc(Math.abs(rec.camera_offset.along_road_m).toFixed(1))}m</b> 옆 · ` : ''}카카오 마커 ${rec.target_pixel ? `화면 x=${esc(rec.target_pixel.x.toFixed(0))}, y=${esc(rec.target_pixel.y.toFixed(0))}` : '화면 밖'}<br>
      모델 ${esc(m.model_id)} · ${esc(m.dtype)} · attn ${esc(m.attn_implementation || '-')}${rec.timing && rec.timing.assessment_s != null ? ` · 걸린 시간 ${esc(rec.timing.assessment_s)}초 (생각 포함)` : ''}<br>
      이미지 SHA-256 ${esc((rec.image_sha256 || '').slice(0, 16))}… · ${esc(rec.generated_at)} · ${esc(rec.schema_version)}</div>
    ${rec.assessment_thinking ? `<details><summary>생각 과정${rec.assessment_thinking_cut ? ' (생각이 길어 중간에 끊고 답하게 함)' : ''}</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(rec.assessment_thinking)}</pre></details>` : ''}
    <details><summary>모델 원본 응답</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(rec.assessment_raw || '')}</pre></details>
    ${rec.gis_context ? `<details><summary>GIS 기본 판정 (참고): ${esc(rec.gis_context.verdict)}</summary>${rec.gis_context.fail_reasons.map(r => `<div>불가: ${esc(r)}</div>`).join('')}${rec.gis_context.check_reasons.map(r => `<div>확인: ${esc(r)}</div>`).join('')}<div class="muted">사진 판정은 GIS 판정을 바꾸지 않습니다.</div></details>` : ''}`;
}

function qwenRecordHtml(rec, images, manual) {
  if (!rec) return '';
  if (rec.mode === 'stop_check') return stopCheckHtml(rec, images, manual);
  const v = rec.viewpoint || {}, m = rec.model || {}, loc = rec.localization, a = rec.assessment, d = rec.decision;
  const fo = a && a.fixed_obstruction;
  const condRows = (d.conditions || []).map(c => `<tr><td>${esc(c.label)}</td><td>${esc(c.value)}</td><td class="${STATUS_CLS[c.status] || ''}">${esc(STATUS_TEXT[c.status] || c.status)}</td><td>${esc(c.evidence)}</td></tr>`).join('');
  const locLine = loc ? `<p>판독 위치: <b>${esc(STATUS_KO[loc.sidewalk_status] || (loc.target_visible ? '보도 찾음' : '-'))}</b>${loc.reading_point ? ` [${loc.reading_point.map(n => n.toFixed(0)).join(', ')}]` : ''}${loc.lifted ? ' (연석 쪽 점을 보도 가운데로 올림)' : ''}${loc.evidence ? ` · ${esc(loc.evidence)}` : ''}</p>` : (rec.localization_error ? `<p class="f">판독 위치: ${esc(rec.localization_error)}</p>` : '');
  return `${qwenDecisionHtml(d)}${locLine}
    <h3>원본 로드뷰 · 판독 위치</h3>${qwenOverlay(rec, images && images.original, manual)}
    <div class="muted">파노라마 ${esc(rec.pano_id)} · 촬영 위치↔후보 거리 <b>${esc(rec.distance_m)}m</b> · 화면 방향 pan ${esc(Number(v.pan).toFixed(1))}° / tilt ${esc(Number(v.tilt).toFixed(1))}° / zoom ${esc(v.zoom)} (조회 heading ${esc(rec.query_heading)}°, ${esc(rec.view_mode)})<br>
      ${rec.camera_offset ? `촬영 위치는 후보에서 도로를 따라 <b>${esc(Math.abs(rec.camera_offset.along_road_m).toFixed(1))}m</b> 옆 (화면 가운데 판독 지점과 후보의 대략적 차이) · ` : ''}카카오 마커 ${rec.target_pixel ? `화면 x=${esc(rec.target_pixel.x.toFixed(0))}, y=${esc(rec.target_pixel.y.toFixed(0))}` : '화면 밖'} · 보도 판독 지점 ${rec.snapped_sidewalk_point ? `[${rec.snapped_sidewalk_point.map(n => n.toFixed(0)).join(', ')}]` : '없음'} · 연석 ${rec.snapped_curb_point ? `[${rec.snapped_curb_point.map(n => n.toFixed(0)).join(', ')}]` : '없음'} (0~1000)<br>
      모델 ${esc(m.model_id)} · 경로 ${esc(m.model_path)} · ${esc(m.dtype)} · attn ${esc(m.attn_implementation || '-')}<br>
      ${rec.timing ? `걸린 시간: 1차 ${rec.timing.localization_s != null ? esc(rec.timing.localization_s) + '초' : '-'} · 2차(생각 포함) ${rec.timing.assessment_s != null ? esc(rec.timing.assessment_s) + '초' : '-'}<br>` : ''}
      이미지 SHA-256 ${esc((rec.image_sha256 || '').slice(0, 16))}… · ${esc(rec.generated_at)} · ${esc(rec.schema_version)}</div>
    ${images && images.snapped_full ? `<h3>2차 판독에 넣은 이미지</h3><img alt="판독 지점 표시 전체 이미지" src="data:image/png;base64,${images.snapped_full}" style="width:100%">` : ''}
    <h3>1차 · 보도 판독 위치 ${rec.reading_source === 'manual' ? '(직접 지정)' : (rec.search && rec.search.valid ? '(지도 계산 상자 안에서 탐색)' : '(화면 가운데 기준)')}</h3>
    ${rec.localization_error ? `<div class="f">검증 실패: ${esc(rec.localization_error)}</div>` : ''}
    ${loc ? `<table class="chk"><tr><td>보도 상태</td><td>${esc(({visible:'보도 찾음',occluded:'가려져 확인 못함',absent:'보도 없음'})[loc.sidewalk_status] || tri(loc.target_visible))}</td></tr>${loc.curb_note ? `<tr><td>연석</td><td>${esc(loc.curb_note)}</td></tr>` : ''}${loc.center_shift ? `<tr><td>가운데에서 옮긴 정도</td><td>${esc(loc.center_shift)} (0~1000 기준, 가운데가 가려져 옆으로 찍음)</td></tr>` : ''}
      ${loc.target_visible ? `<tr><td>curb_point</td><td>${esc(JSON.stringify(loc.curb_point))}</td></tr><tr><td>curb_region</td><td>${esc(JSON.stringify(loc.curb_region))}</td></tr><tr><td>sidewalk_point (판독 지점)</td><td>${esc(JSON.stringify(loc.sidewalk_point ?? null))}</td></tr><tr><td>sidewalk_region</td><td>${esc(JSON.stringify(loc.sidewalk_region ?? null))}</td></tr><tr><td>층 순서 (가까운→먼)</td><td>${esc(loc.layer_order.join(' → '))}</td></tr>` : ''}
      <tr><td>근거</td><td>${esc(loc.evidence)}</td></tr></table>` : ''}
    <h3>2차 · 표시 보도 지점의 승하차 조건</h3>
    ${rec.assessment_error ? `<div class="f">검증 실패: ${esc(rec.assessment_error)}</div>` : ''}
    ${condRows ? `<table class="chk"><tr><th>조건</th><th>값</th><th>판정</th><th>사진 근거</th></tr>${condRows}</table>` : ''}
    ${fo ? `<div class="muted">고정 차단물 상세: 값 ${esc(tri(fo.value))} · 종류 ${esc(OBS_TYPE[fo.type] || fo.type)} · 연석과의 관계 ${esc(OBS_REL[fo.relation] || fo.relation)} · 표시 위치 개구부 ${esc(tri(fo.opening_at_target))}${fo.excluded_transient ? ` · 일시 점유물 '${esc(fo.excluded_transient)}' 분리` : ''}</div>` : ''}
    ${rec.curb_line_measure ? `<div class="muted">규제선 색 측정: <b>${esc(LINE_MEASURE_KO[rec.curb_line_measure.value] || '판단 보류')}</b> · ${esc(rec.curb_line_measure.evidence)}${a && a.curb_line && a.curb_line.source === 'color_measure' ? ` · 모델 답 ${esc(LINE_MEASURE_KO[a.curb_line.model_value] || a.curb_line.model_value)} 대신 측정값 사용` : (a && a.curb_line && a.curb_line.measure_agrees ? ' · 모델 답과 같음' : '')}</div>` : ''}
    ${rec.assessment_thinking ? `<details><summary>2차 생각 과정${rec.assessment_thinking_cut ? ' (생각이 길어 중간에 끊고 답하게 함)' : ''}</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(rec.assessment_thinking)}</pre></details>` : ''}
    <details><summary>모델 원본 응답</summary><pre style="white-space:pre-wrap;font-size:11px">[1차]\n${esc(rec.localization_raw || '')}\n\n[2차]\n${esc(rec.assessment_raw || '')}</pre></details>
    ${rec.gis_context ? `<details><summary>GIS 기본 판정 (참고): ${esc(rec.gis_context.verdict)}</summary>${rec.gis_context.fail_reasons.map(r => `<div>불가: ${esc(r)}</div>`).join('')}${rec.gis_context.check_reasons.map(r => `<div>확인: ${esc(r)}</div>`).join('')}<div class="muted">사진 판정은 GIS 판정을 바꾸지 않습니다.</div></details>` : ''}`;
}

const STATUS_KO = {visible:'보도 찾음', occluded:'가려져서 찾지 못함', absent:'보도 없음'};

function locateHtml(rec, images) {
  if (!rec) return '';
  const loc = rec.localization, v = rec.viewpoint || {}, sb = rec.search || {};
  const status = rec.localization_error ? '찾지 못함 (오류)' : loc ? (STATUS_KO[loc.sidewalk_status] || loc.sidewalk_status) : '-';
  const ok = loc && loc.target_visible;
  return `<section class="note"><h3>판독 위치: <span class="pill ${ok ? 'ok' : 'chk'}">${esc(status)}</span></h3>
    ${ok ? `<p>보도 판독 지점 <b>[${loc.reading_point.map(n => n.toFixed(0)).join(', ')}]</b> (0~1000, 가운데 x=500에서 ${esc(loc.center_shift)} 옆)</p>` : ''}
    ${ok && loc.lifted ? `<p class="muted">모델이 찍은 점 [${loc.model_point.map(n => n.toFixed(0)).join(', ')}]이 보도 가운데보다 연석 쪽이라 보도 가운데(먼 끝과 연석의 중간)로 올렸습니다 (회색 작은 원).</p>` : ''}
    ${rec.localization_error ? `<p class="f">${esc(rec.localization_error)}</p>` : ''}
    ${loc && loc.evidence ? `<p>근거: ${esc(loc.evidence)}</p>` : ''}
    ${loc && loc.curb_note ? `<p class="muted">${esc(loc.curb_note)}</p>` : ''}
  </section>
  ${qwenOverlay(rec, images && images.original, null, false)}
  <div class="muted">파노라마 ${esc(rec.pano_id)} · 촬영 위치↔후보 거리 ${esc(rec.distance_m)}m${rec.camera_offset ? ` · 도로를 따라 ${esc(Math.abs(rec.camera_offset.along_road_m).toFixed(1))}m 옆` : ''} · 화면 방향 pan ${esc(Number(v.pan).toFixed(1))}° (heading ${esc(rec.query_heading)}°)<br>
    탐색 상자 ${sb.valid ? esc(JSON.stringify(sb.box)) : '계산 불가' + (sb.reason ? ': ' + esc(sb.reason) : '')}${loc && loc.layer_order && loc.layer_order.length ? ` · 층 순서 ${esc(loc.layer_order.join(' → '))}` : ''}<br>
    ${esc(rec.generated_at)} · ${esc(rec.schema_version)}</div>
  <details><summary>모델 원본 응답</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(rec.localization_raw || '')}</pre></details>`;
}

function photoForm(f) {
  if (!SERVER || !VLM_ENABLED) return '';
  const id = f.properties.id;
  if (!photoDrafts.has(id)) photoDrafts.set(id, {record:null, images:null, manual:null, message:'', busy:false, restored:false});
  const s = photoDrafts.get(id);
  const info = VLM_INFO || {};
  return `<section class="note"><h3>로드뷰 정차 판독 · ${esc(id)}</h3>
    <div class="muted">모델 ${esc(info.model_id)} · 보도 → 차도–보도 사이 고정 장애물 → 주차장 입구 → 연석 앞 차선 순서로 판독 → Python 판정 (가능/불가/판단 불가)</div>
    <p><button id="photoAnalyze" ${s.busy ? 'disabled' : ''}>${s.busy ? '로드뷰 연결·판독 중…' : (s.record ? '다시 판독' : '정차 판독')}</button></p>
    <p id="photoStatus" role="status">${esc(s.message)}</p>
    ${qwenRecordHtml(s.record, s.images, s.manual)}
  </section>`;
}

function bindPhotoForm(f) {
  if (!$('photoAnalyze')) return;
  const id = f.properties.id, s = photoDrafts.get(id);
  const render = () => { if (selected && selected.properties.id === id) show(selected); };
  if (!s.restored && !s.busy) {
    s.restored = true;
    fetch(`/api/vlm/result?candidate_id=${encodeURIComponent(id)}`).then(r => r.ok ? r.json() : null).then(body => {
      if (body && body.record && !s.record) { s.record = body.record; s.message = `저장된 판독 결과 (${body.record.generated_at})`; render(); }
    }).catch(() => {});
  }
  $('photoAnalyze').onclick = async () => {
    if (s.busy) return;
    s.busy = true; s.record = null; s.images = null; s.manual = null;
    const started = Date.now();
    s.message = '로드뷰 캡처 → 보도·장애물·주차장 입구·차선 판독 진행 중 (0초). 첫 실행은 모델 로딩 시간이 추가됩니다.'; render();
    const timer = setInterval(() => { s.message = `진행 중 (${Math.floor((Date.now() - started) / 1000)}초).`; const e = $('photoStatus'); if (e) e.textContent = s.message; }, 1000);
    try {
      const res = await fetch('/api/vlm/roadview', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({candidate_id:id, thresholds})});
      const body = await res.json(); if (!res.ok) throw new Error(body.error || res.status);
      s.record = body.record; s.images = body.images;
      s.message = `판독 완료 (${Math.floor((Date.now() - started) / 1000)}초). 결과는 pudo3/runtime/results/에 저장됐습니다.`;
      refresh();
    } catch (error) { s.message = `판독 실패: ${error.message}`; }
    finally { clearInterval(timer); s.busy = false; render(); }
  };
  if ($('qwenPhoto')) $('qwenPhoto').onclick = (event) => {
    if (s.busy) return;
    const r = event.currentTarget.getBoundingClientRect();
    const x = Math.min(1000, Math.max(0, (event.clientX - r.left) / r.width * 1000));
    const y = Math.min(1000, Math.max(0, (event.clientY - r.top) / r.height * 1000));
    s.manual = [Math.round(x), Math.round(y)]; render();
  };
  if ($('photoManual')) $('photoManual').onclick = async () => {
    if (s.busy || !s.manual || !s.record) return;
    s.busy = true;
    const started = Date.now(), point = s.manual;
    s.message = `직접 지정한 위치 [${point.join(', ')}]로 조건 판독 중…`; render();
    try {
      const res = await fetch('/api/vlm/reassess', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({record_id:s.record.record_id, point})});
      const body = await res.json(); if (!res.ok) throw new Error(body.error || res.status);
      s.record = body.record; s.images = body.images; s.manual = null;
      s.message = `직접 지정 위치로 판독 완료 (${Math.floor((Date.now() - started) / 1000)}초).`;
      refresh();
    } catch (error) { s.message = `다시 판독 실패: ${error.message}`; }
    finally { s.busy = false; render(); }
  };
}

function show(f) {
  selected = f; const p = f.properties, [lon, lat] = f.geometry.coordinates;
  if (selectedRing) map.removeLayer(selectedRing);
  selectedRing = L.circleMarker([lat, lon], {radius:11, color:'#1f6feb', weight:3, fill:false, interactive:false}).addTo(map);
  const rv = reviews[p.id] || {};
  const rows = p.checks.map(c => `<tr class="${off.has(code(c.item)) ? 'off' : ''}"><td>${esc(c.item)}</td><td>${c.value === null || c.value === undefined ? '<i>없음</i>' : esc(c.value)}${c.estimated ? ' <span class="est">(추정)</span>' : ''}</td><td class="muted">${esc(c.threshold)}</td><td class="${c.pass === true ? 'p' : c.pass === false ? 'f' : 'u'}">${c.pass === true ? '통과' : c.pass === false ? '탈락' : '모름'}${off.has(code(c.item)) ? ' (해제)' : ''}</td></tr>`).join('');
  const kakao = `https://map.kakao.com/link/roadview/${lat},${lon}`;
  const google = p.image_id ? `https://www.google.com/maps/@?api=1&map_action=pano&pano=${encodeURIComponent(p.image_id)}&heading=${p.heading}&fov=90` : null;
  $('overview').hidden = true;
  const d = $('detail'); d.hidden = false;
  d.innerHTML = `
    <button class="back" id="bBack">← 개요로</button>
    <h2>${esc(p.id)} <span class="pill ${PILL[V(p)]}">${esc(V(p))}</span>${V(p) !== baseV(p) ? ` <span class="muted">(전체 규칙 적용 시 ${esc(baseV(p))})</span>` : ''} ${p.score !== null ? `점수 ${esc(p.score)}` : ''}</h2>
    <div class="muted">${esc(p.name || '(이름 없음)')} · ${esc(ROAD[p.road_type] || p.road_type)}${p.oneway ? ' · 일방통행' : ''} · ${lat.toFixed(5)}, ${lon.toFixed(5)} · 바라보는 방향 ${esc(p.heading)}°</div>
    <div class="links"><a href="${kakao}" target="_blank" rel="noopener">카카오 로드뷰 열기</a>${google ? `<a href="${google}" target="_blank" rel="noopener">구글 스트리트뷰 열기</a>` : ''}</div>
    <div class="muted">${p.image_id ? '구글 사진 있음 (사진 ID로 열림)' : '연결된 구글 사진 없음. 카카오 로드뷰로 확인'} · ${p.qwen ? `Qwen 사진 판정: <b>${esc(p.qwen.verdict)}</b> — ${esc(p.qwen.reason)}` : 'Qwen 사진 판독 결과 없음'}</div>
    ${photoForm(f)}
    ${FR(p).length ? `<h3>불가 사유</h3><ul class="reason">${FR(p).map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
    ${CR(p).length ? `<h3>확인 필요 사유</h3><ul class="reason">${CR(p).map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
    <table class="chk"><tr><th>항목</th><th>값</th><th>기준</th><th>결과</th></tr>${rows}</table>
    <div class="btns"><button id="bOk">승인</button><button id="bNo">반려</button><button id="bClr">지움</button> <span class="muted" id="rvState"></span></div>
    <textarea id="note" placeholder="메모 (입력하면 자동 저장)">${esc(rv.note || '')}</textarea>
    <div class="muted">승인·반려와 메모는 이 브라우저에만 저장됩니다. "GeoJSON 내보내기"로 파일에 담깁니다.</div>`;
  const state = () => { const r = reviews[p.id]; $('rvState').textContent = r ? `${r.review || '메모만'} (${r.at || ''})` : '검토 전'; };
  const stamp = () => new Date().toISOString().slice(0, 16).replace('T', ' ');
  const save = (review) => {
    const note = $('note').value.trim();
    if (review === null) delete reviews[p.id];
    else reviews[p.id] = {review: review === undefined ? (reviews[p.id] || {}).review || null : review, note, at: stamp()};
    if (reviews[p.id] && !reviews[p.id].review && !reviews[p.id].note) delete reviews[p.id];
    saveReviews(); state();
  };
  state();
  $('bOk').onclick = () => save('승인'); $('bNo').onclick = () => save('반려');
  $('bClr').onclick = () => { $('note').value = ''; save(null); };
  $('note').oninput = () => save(undefined);
  bindPhotoForm(f);
  $('bBack').onclick = () => { d.hidden = true; $('overview').hidden = false; if (selectedRing) map.removeLayer(selectedRing); selected = null; draw(); };
}

['fVerdict', 'fRoad', 'fReason'].forEach(id => $(id).addEventListener('input', () => { draw(); if (selected) show(selected); }));
$('btnExport').onclick = () => {
  const fc = {type:'FeatureCollection', features:PUDO.features.map(f => { const r = reviews[f.properties.id] || {}; return {...f, properties:{...f.properties, review:r.review || null, note:r.note || null, reviewed_at:r.at || null,
    verdict_current:V(f.properties), rules_off:[...off]}}; })};
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(fc)], {type:'application/geo+json'})); a.download = 'pudo_v0_reviewed.geojson'; a.click();
};
$('btnHtml').onclick = async () => {
  const res = await fetch('/api/export', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({thresholds, rules_off:[...off]})});
  if (!res.ok) { $('busy').textContent = '저장 실패'; return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = 'pudo_result.html'; a.click();
};
draw();
connectServer();
</script>
</body>
</html>
